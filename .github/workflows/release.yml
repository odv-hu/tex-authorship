# Release: push a tag like v0.1.9 (e.g. from Fork: New Tag… → push), or run it by hand from the
# Actions tab for an unpublished tag. All source versions must match the tag; releases use the normal
# GitHub and Marketplace release channels regardless of minor-version parity.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished tag to release, e.g. v0.1.9
        required: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag syntax
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected vMAJOR.MINOR.PATCH"; exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require version-aligned tagged source
        id: version
        run: |
          VERSION=$(node scripts/check-release.js "$TAG")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  checks:
    needs: preflight
    uses: ./.github/workflows/checks.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release:
    needs: [preflight, checks]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.preflight.outputs.version }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/check-release.js "$TAG"

      - name: Build packages
        run: |
          npx --yes @vscode/vsce@3 package -o "tex-authorship-$VERSION.vsix"
          (cd latex && zip -X "../authorship-latex-$VERSION.zip" authorship.sty authorship.lua)

      - name: Inspect archives before publication
        run: python3 scripts/verify-artifacts.py .

      - name: Release notes from commits since the previous tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}$TAG"
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s' "$RANGE"
            echo
            echo "## Install"
            echo
            echo "- **VS Code:** search \"TeX Authorship\" in the Extensions panel, or download \`tex-authorship-$VERSION.vsix\` below and run *Extensions: Install from VSIX…*."
            echo "- **LaTeX package only:** unzip \`authorship-latex-$VERSION.zip\` next to your \`.tex\` file and add \`\\usepackage{authorship}\`."
            if [ -n "$PREV" ]; then
              echo
              echo "Full diff: https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=("tex-authorship-$VERSION.vsix" "authorship-latex-$VERSION.zip")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; published assets will not be replaced."
            exit 1
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TAG" --notes-file notes.md
          fi

      - name: Publish to the VS Code Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3 publish --packagePath "tex-authorship-$VERSION.vsix" -p "$VSCE_PAT"

      - name: Marketplace skipped
        if: env.HAS_VSCE_PAT != 'true'
        run: echo "::notice::No VSCE_PAT secret set, so the Marketplace step was skipped. Upload tex-authorship-$VERSION.vsix from the release by hand."
